name: Deploy

# BS-3 / BS-4: deployment is a separate, explicit workflow — never inferred
# from CI green. Semantics:
#   - BSCODE_DEPLOY_ENABLED=true  -> deployment EXPECTED: missing secrets or
#     missing real worker URL is a hard FAIL (no fallback, no example URLs).
#   - BSCODE_DEPLOY_ENABLED unset/false -> explicit SKIPPED outcome, visible
#     in the run summary; never reported as DEPLOYED.

on:
  push:
    branches: [main]
  # N2-P1-09: deployment workflow/config changes must pass a PR-safe dry-run
  # validation. The real deploy job below is gated to non-PR events.
  #
  # Required-check architecture (N3-P1-03): the pull_request trigger has no
  # `paths:` filter (which would leave a required check Expected/Pending
  # forever). Relevance is detected in `changes`, `deploy-dry-run` runs only
  # when relevant, and `deploy-dry-run-summary` always emits the stable required
  # check "Deploy dry-run".
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  changes:
    name: Detect deploy-relevant changes
    runs-on: ubuntu-latest
    outputs:
      relevant: ${{ steps.detect.outputs.relevant }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - id: detect
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          base="${{ github.event.pull_request.base.sha }}"
          if git diff --name-only "$base"...HEAD | grep -qE '(^\.github/workflows/deploy\.yml$|^apps/worker/wrangler|^apps/worker/package\.json$|^apps/web/wrangler|^apps/web/package\.json$|^bun\.lock$)'; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
          else
            echo "relevant=false" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    name: Deploy to production
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          # O4: deploy from the exact source SHA of this run, never a moving ref.
          ref: ${{ github.sha }}

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.3.14"

      - name: Install dependencies (frozen)
        run: bun install --frozen-lockfile

      - name: Resolve deployment intent
        id: intent
        env:
          ENABLED: ${{ vars.BSCODE_DEPLOY_ENABLED }}
        run: |
          if [ "$ENABLED" = "true" ]; then
            echo "state=expected" >> "$GITHUB_OUTPUT"
          else
            echo "state=not-configured" >> "$GITHUB_OUTPUT"
            echo "::notice::Deployment not configured (BSCODE_DEPLOY_ENABLED != true) — explicit SKIPPED, not DEPLOYED."
          fi

      - name: Record deployment provenance (O4)
        if: steps.intent.outputs.state == 'expected'
        run: |
          set -euo pipefail
          {
            echo "source_sha=${GITHUB_SHA}"
            echo "toolchain_bun=$(bun --version)"
            echo "bun_lock_sha256=$(sha256sum bun.lock | cut -d' ' -f1)"
            echo "timestamp=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } | tee deployment-provenance.txt

      - name: Upload deployment provenance (O4)
        if: steps.intent.outputs.state == 'expected'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: deployment-provenance-${{ github.sha }}
          path: deployment-provenance.txt
          retention-days: 90

      - name: Verify production configuration (BS-4)
        if: steps.intent.outputs.state == 'expected'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WORKER_URL: ${{ vars.BSCODE_WORKER_URL }}
        run: |
          missing=0
          [ -z "$CLOUDFLARE_API_TOKEN" ] && { echo "::error::CLOUDFLARE_API_TOKEN missing — deployment expected, FAIL"; missing=1; }
          [ -z "$CLOUDFLARE_ACCOUNT_ID" ] && { echo "::error::CLOUDFLARE_ACCOUNT_ID missing — deployment expected, FAIL"; missing=1; }
          [ -z "$WORKER_URL" ] && { echo "::error::BSCODE_WORKER_URL missing — a real production worker URL is required (BS-4: no fallback URLs)"; missing=1; }
          case "$WORKER_URL" in
            *example.com*)
              echo "::error::BSCODE_WORKER_URL contains a placeholder/example domain — refusing to deploy (BS-4)"
              missing=1 ;;
          esac
          exit $missing

      - name: Deploy worker to Cloudflare
        if: steps.intent.outputs.state == 'expected'
        run: bun run deploy:worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy web to Cloudflare Pages
        if: steps.intent.outputs.state == 'expected'
        run: bun run deploy:web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          NEXT_PUBLIC_WORKER_URL: ${{ vars.BSCODE_WORKER_URL }}

      - name: Record deployment outcome
        if: always()
        run: |
          case "${{ steps.intent.outputs.state }}" in
            expected)
              if [ "${{ job.status }}" = "success" ]; then
                echo "DEPLOYED: production deploy executed from ${GITHUB_SHA}"
              else
                echo "DEPLOY FAILED — CI green does not imply deploy green"
                exit 1
              fi ;;
            not-configured)
              echo "SKIPPED: deployment not configured — this run must NOT be read as DEPLOYED" ;;
          esac

  # N2-P1-09: PR-safe validation for deployment workflow/config changes. The
  # worker bundle is built with `wrangler deploy --dry-run` (no credentials, no
  # network deploy) so a broken deploy config fails before merge.
  deploy-dry-run:
    name: Deploy dry-run (internal)
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.relevant == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.3.14"

      - name: Install dependencies (frozen)
        run: bun install --frozen-lockfile

      - name: Worker bundle dry-run (no deploy)
        run: bun --filter @bscode/worker build

  deploy-dry-run-summary:
    name: Deploy dry-run
    needs: [changes, deploy-dry-run]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Evaluate dry-run result
        run: |
          set -euo pipefail
          result="${{ needs.deploy-dry-run.result }}"
          echo "Detected relevance: ${{ needs.changes.outputs.relevant }}"
          echo "Deploy dry-run result: ${result}"
          if [ "${result}" = "failure" ] || [ "${result}" = "cancelled" ]; then
            echo "::error::deploy dry-run did not pass (${result})"
            exit 1
          fi
