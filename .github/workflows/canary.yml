name: Canary (latest published packages)

# BS-5: the latest-published canary lane. Intentionally resolves selected
# @wasmagent packages to @latest to catch upstream breakage early.
# NON-CERTIFYING: a green canary never implies the locked lane is green and
# must never rewrite the certified stack lock. Exact resolved versions are
# always recorded in the run summary artifact.

on:
  schedule:
    - cron: "0 4 * * *" # 04:00 UTC daily
  workflow_dispatch:
  repository_dispatch:
    types: [wasmagent-js-updated]

permissions:
  contents: read

jobs:
  canary:
    name: Latest-published canary (non-certifying)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.3.14"

      - name: Record dispatch provenance
        if: github.event_name == 'repository_dispatch'
        env:
          PAYLOAD: ${{ toJson(github.event.client_payload) }}
        run: |
          echo "::notice::repository_dispatch payload: producer=${{ github.event.client_payload.producer_repo }} sha=${{ github.event.client_payload.producer_sha }} package=${{ github.event.client_payload.package }} version=${{ github.event.client_payload.package_version }}"
          echo "$PAYLOAD" > dispatch-provenance.json

      - name: Resolve latest published @wasmagent packages
        id: resolve
        run: |
          for pkg in @wasmagent/aep @wasmagent/mcp-server; do
            v=$(npm view "$pkg" version)
            echo "$pkg=$v" >> resolved-versions.txt
            echo "- \`$pkg@$v\`" | tee -a "$GITHUB_STEP_SUMMARY"
          done

      - name: Install with latest canary packages
        run: |
          bun remove @wasmagent/aep @wasmagent/mcp-server >/dev/null
          bun add @wasmagent/aep@latest @wasmagent/mcp-server@latest
          cp resolved-versions.txt canary-resolution.txt
          echo "source_sha=$GITHUB_SHA" >> canary-resolution.txt
          echo "run_id=$GITHUB_RUN_ID" >> canary-resolution.txt
          echo "timestamp=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> canary-resolution.txt

      - name: Typecheck (worker)
        working-directory: apps/worker
        run: bunx tsc --noEmit

      - name: Test (worker)
        working-directory: apps/worker
        run: bun run test

      - name: Test (web)
        working-directory: apps/web
        run: bun run test

      - name: Upload canary resolution snapshot
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: canary-resolution-${{ github.run_id }}
          path: |
            canary-resolution.txt
            dispatch-provenance.json
          if-no-files-found: ignore
