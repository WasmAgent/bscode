name: Org Compatibility

# Pre-merge cross-repo compatibility gate (N2-P1-06). Calls the org-owned
# reusable workflow, pinned by immutable SHA, so that contract/release-sensitive
# changes cannot merge on local CI alone.
#
# Required-check architecture (N3-P1-03): the workflow triggers on every pull
# request (no workflow-level `paths:` filter, which would leave the required
# check Expected/Pending forever). Relevance is detected locally, the heavy
# cross-repo gate runs only when relevant, and a final summary job always emits
# the stable required check "Org compatibility (bscode)".
#
# Follow-up: make that check required in branch protection once this workflow is
# on main.

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  changes:
    name: Detect contract-sensitive changes
    runs-on: ubuntu-latest
    outputs:
      relevant: ${{ steps.detect.outputs.relevant }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - id: detect
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          base="${{ github.event.pull_request.base.sha }}"
          if git diff --name-only "$base"...HEAD | grep -qE '^(apps/|fixtures/|scripts/|package.json|bun.lock|\.github/workflows/)'; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
          else
            echo "relevant=false" >> "$GITHUB_OUTPUT"
          fi

  org-compat:
    name: Org compat (bscode, internal)
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    uses: WasmAgent/.github/.github/workflows/reusable-compat-check.yml@baad7dbdbc7296b6fe3113a84693b867bacfeab3
    with:
      repo: bscode
      candidate_sha: ${{ github.event.pull_request.head.sha || github.sha }}

  org-compat-summary:
    name: Org compatibility (bscode)
    needs: [changes, org-compat]
    if: always()
    runs-on: ubuntu-latest
    steps:
      # The evaluator is loaded from the immutable org-gate revision, never
      # from the candidate tree, so a candidate cannot weaken the decision.
      - name: Checkout org gate evaluator
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: WasmAgent/.github
          ref: ca2067cda59a58dc67a824ff6e4a0c58c5addf95
          path: .org
      - name: Evaluate result (strict allowlist)
        run: |
          set -euo pipefail
          node .org/scripts/org-contract/required-result.mjs \
            --changes-result "${{ needs.changes.result }}" \
            --relevant "${{ needs.changes.outputs.relevant }}" \
            --inner-name "org-compat" \
            --inner-result "${{ needs.org-compat.result }}"
